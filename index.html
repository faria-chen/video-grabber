<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频抓取器 - 无水印视频下载</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 600px;
            text-align: center;
        }
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            padding: 50px 40px;
        }
        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        .subtitle {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        .platforms {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .platform {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 25px;
            font-weight: 600;
        }
        .info {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
        }
        .info h3 {
            color: #333;
            margin-bottom: 15px;
        }
        .info p {
            color: #666;
            line-height: 1.8;
        }
        .deploy-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 15px 40px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .deploy-btn:hover {
            background: #218838;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1> video Grabber</h1>
            <p class="subtitle">无水印视频下载工具</p>
            
            <div class="platforms">
                <span class="platform">微信视频号</span>
                <span class="platform">抖音</span>
                <span class="platform">小红书</span>
            </div>
            
            <div class="info">
                <h3> 部署说明</h3>
                <p>
                    这是一个需要后端服务的Web应用<br>
                    请通过 Render 部署完整版本
                </p>
            </div>
            
            <a href="https://render.com/deploy?repo=https://github.com/faria-chen/video-grabber" class="deploy-btn">
                 部署到 Render
            </a>
        </div>
    </div>
</body>
</html>
