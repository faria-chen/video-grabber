<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频抓取器 - 无水印视频下载</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container { width: 100%; max-width: 500px; }
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            padding: 40px 30px;
        }
        h1 { color: #333; font-size: 2em; text-align: center; margin-bottom: 8px; }
        .subtitle { color: #999; text-align: center; font-size: 0.95em; margin-bottom: 30px; }
        .platforms { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; }
        .platform { padding: 6px 16px; background: #f0f0f0; border-radius: 20px; font-size: 0.85em; color: #666; }
        .input-group { margin-bottom: 20px; }
        .input-group input {
            width: 100%; padding: 16px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px; transition: all 0.3s;
        }
        .input-group input:focus { outline: none; border-color: #667eea; }
        .btn {
            width: 100%; padding: 16px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer; transition: all 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(102,126,234,0.4); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .result { margin-top: 25px; display: none; }
        .result.show { display: block; }
        .video-info { background: #f8f9fa; border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        .video-info h3 { color: #333; font-size: 1em; margin-bottom: 10px; word-break: break-all; }
        .video-preview { width: 100%; border-radius: 10px; margin-bottom: 15px; background: #000; }
        .download-btn {
            display: block; width: 100%; padding: 14px; background: #28a745; color: white;
            text-align: center; border-radius: 10px; text-decoration: none; font-weight: 600; transition: all 0.3s;
        }
        .download-btn:hover { background: #218838; }
        .error { background: #fff3cd; border: 1px solid #ffc107; color: #856404; padding: 15px; border-radius: 10px; text-align: center; }
        .loading { text-align: center; color: #666; padding: 20px; }
        .tips {
            margin-top: 20px; padding: 15px; background: #e8f4fd; border-radius: 10px; font-size: 0.85em; color: #0c5460;
        }
        .tips h4 { margin-bottom: 8px; }
        .tips ul { padding-left: 20px; }
        .tips li { margin-bottom: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>✨ 视频抓取器</h1>
            <p class="subtitle">微信视频号 | 抖音 | 小红书</p>
            
            <div class="platforms">
                <span class="platform">微信视频号</span>
                <span class="platform">抖音</span>
                <span class="platform">小红书</span>
            </div>
            
            <div class="input-group">
                <input type="text" id="videoUrl" placeholder="粘贴视频分享链接..." autocomplete="off">
            </div>
            
            <button class="btn" id="grabBtn" onclick="grabVideo()">
                抓取视频
            </button>
            
            <div class="result" id="result"></div>
            
            <div class="tips">
                <h4>使用说明</h4>
                <ul>
                    <li>打开对应App → 点击分享 → 复制链接</li>
                    <li>粘贴到上方输入框 → 点击抓取</li>
                    <li>支持微信视频号、抖音、小红书</li>
                </ul>
            </div>
        </div>
    </div>
    
    <script>
        // 后端 API 地址（Render 部署后改成你的地址）
        const API_BASE = 'https://video-grabber.onrender.com';

        document.getElementById('videoUrl').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') grabVideo();
        });
        
        async function grabVideo() {
            const url = document.getElementById('videoUrl').value.trim();
            const btn = document.getElementById('grabBtn');
            
            if (!url) {
                showResult('<div class="error">请输入视频链接</div>');
                return;
            }
            
            btn.disabled = true;
            btn.textContent = '抓取中...';
            showResult('<div class="loading">⏳ 正在解析视频，请稍候...</div>');
            
            try {
                const formData = new FormData();
                formData.append('url', url);
                formData.append('platform', 'auto');
                
                const response = await fetch(API_BASE + '/api/grab', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok && data.video_url) {
                    showResult(`
                        <div class="video-info">
                            <h3>✅ ${data.title || '视频抓取成功'}</h3>
                        </div>
                        <video class="video-preview" controls src="${data.video_url}"></video>
                        <a class="download-btn" href="${API_BASE}/api/download?video_url=${encodeURIComponent(data.video_url)}&title=${encodeURIComponent(data.title || 'video')}">
                            ⬇️ 下载视频
                        </a>
                    `);
                } else {
                    showResult('<div class="error">' + (data.detail || '暂时无法抓取该视频，请检查链接是否正确') + '</div>');
                }
            } catch (error) {
                showResult('<div class="error">⚠️ 后端服务未启动，请先在 Render 部署后端<br><br>错误: ' + error.message + '</div>');
            }
            
            btn.disabled = false;
            btn.textContent = '抓取视频';
        }
        
        function showResult(html) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = html;
            resultDiv.classList.add('show');
        }
    </script>
</body>
</html>
