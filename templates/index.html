<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频抓取器 - 无水印视频下载</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            padding: 40px;
            margin-bottom: 20px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        .input-group input,
        .input-group select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        
        .platform-tags {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        .platform-tag {
            padding: 8px 16px;
            background: #f0f0f0;
            border-radius: 20px;
            font-size: 14px;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .platform-tag:hover {
            background: #667eea;
            color: white;
        }
        
        .platform-tag.active {
            background: #667eea;
            color: white;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .result {
            margin-top: 30px;
            display: none;
        }
        
        .result.show {
            display: block;
        }
        
        .result-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }
        
        .result-card h3 {
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .result-card h3::before {
            content: "✓";
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            background: #28a745;
            color: white;
            border-radius: 50%;
            font-size: 14px;
        }
        
        .video-info {
            display: grid;
            gap: 10px;
        }
        
        .info-row {
            display: flex;
            gap: 10px;
        }
        
        .info-label {
            font-weight: 600;
            color: #666;
            min-width: 80px;
        }
        
        .info-value {
            color: #333;
            word-break: break-all;
        }
        
        .video-preview {
            margin-top: 20px;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }
        
        .video-preview video {
            width: 100%;
            max-height: 400px;
        }
        
        .download-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 30px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .download-btn:hover {
            background: #218838;
            transform: translateY(-2px);
        }
        
        .error {
            background: #fff3f3;
            border: 1px solid #ffcdd2;
            color: #d32f2f;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .feature {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
        }
        
        .feature-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        
        .feature h4 {
            color: #333;
            margin-bottom: 5px;
        }
        
        .feature p {
            color: #666;
            font-size: 14px;
        }
        
        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            opacity: 0.8;
        }
        
        @media (max-width: 600px) {
            .card {
                padding: 25px;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
            
            .info-row {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>  视频抓取器</h1>
            <p>支持微信视频号 | 抖音 | 小红书 - 无水印视频下载</p>
        </div>
        
        <div class="card">
            <form id="grabForm">
                <div class="input-group">
                    <label for="url">视频链接</label>
                    <input type="text" id="url" name="url" placeholder="粘贴视频分享链接..." required>
                    <div class="platform-tags">
                        <span class="platform-tag active" data-platform="auto">自动识别</span>
                        <span class="platform-tag" data-platform="wechat">微信视频号</span>
                        <span class="platform-tag" data-platform="douyin">抖音</span>
                        <span class="platform-tag" data-platform="xiaohongshu">小红书</span>
                    </div>
                </div>
                
                <button type="submit" class="btn" id="submitBtn">
                    抓取视频
                </button>
            </form>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在抓取视频，请稍候...</p>
            </div>
            
            <div class="error" id="error"></div>
            
            <div class="result" id="result">
                <div class="result-card">
                    <h3>抓取成功</h3>
                    <div class="video-info">
                        <div class="info-row">
                            <span class="info-label">标题</span>
                            <span class="info-value" id="title">-</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">平台</span>
                            <span class="info-value" id="platform">-</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">水印</span>
                            <span class="info-value" id="watermark">无水印</span>
                        </div>
                    </div>
                    
                    <div class="video-preview">
                        <video id="videoPlayer" controls></video>
                    </div>
                    
                    <a id="downloadBtn" class="download-btn" href="#" download>
                        下载视频
                    </a>
                </div>
            </div>
        </div>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">  </div>
                <h4>微信视频号</h4>
                <p>支持微信视频号视频抓取</p>
            </div>
            <div class="feature">
                <div class="feature-icon"> </div>
                <h4>抖音</h4>
                <p>抖音无水印视频下载</p>
            </div>
            <div class="feature">
                <div class="feature-icon"> ️</div>
                <h4>小红书</h4>
                <p>小红书视频无水印下载</p>
            </div>
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <h4>快速解析</h4>
                <p>秒级响应，即抓即下</p>
            </div>
        </div>
        
        <div class="footer">
            <p>  视频抓取器 v1.0 | 仅供学习交流使用</p>
        </div>
    </div>
    
    <script>
        let selectedPlatform = 'auto';
        
        // 平台标签点击
        document.querySelectorAll('.platform-tag').forEach(tag => {
            tag.addEventListener('click', function() {
                document.querySelectorAll('.platform-tag').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                selectedPlatform = this.dataset.platform;
            });
        });
        
        // 表单提交
        document.getElementById('grabForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const url = document.getElementById('url').value.trim();
            if (!url) {
                showError('请输入视频链接');
                return;
            }
            
            // 显示加载中
            showLoading(true);
            hideError();
            hideResult();
            
            try {
                const formData = new FormData();
                formData.append('url', url);
                formData.append('platform', selectedPlatform);
                
                const response = await fetch('/api/grab', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showResult(data);
                } else {
                    showError(data.detail || '抓取失败');
                }
            } catch (error) {
                showError('网络错误: ' + error.message);
            } finally {
                showLoading(false);
            }
        });
        
        function showLoading(show) {
            document.getElementById('loading').classList.toggle('show', show);
            document.getElementById('submitBtn').disabled = show;
        }
        
        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }
        
        function hideError() {
            document.getElementById('error').classList.remove('show');
        }
        
        function showResult(data) {
            const resultEl = document.getElementById('result');
            const videoPlayer = document.getElementById('videoPlayer');
            const downloadBtn = document.getElementById('downloadBtn');
            
            document.getElementById('title').textContent = data.title || '未知标题';
            document.getElementById('platform').textContent = getPlatformName(data.platform);
            document.getElementById('watermark').textContent = data.watermark ? '有水印' : '无水印';
            
            // 设置视频源
            videoPlayer.src = data.video_url;
            
            // 设置下载链接
            const downloadUrl = `/api/download?video_url=${encodeURIComponent(data.video_url)}&title=${encodeURIComponent(data.title || 'video')}`;
            downloadBtn.href = downloadUrl;
            
            resultEl.classList.add('show');
        }
        
        function hideResult() {
            document.getElementById('result').classList.remove('show');
        }
        
        function getPlatformName(platform) {
            const names = {
                'wechat': '微信视频号',
                'douyin': '抖音',
                'xiaohongshu': '小红书'
            };
            return names[platform] || platform;
        }
    </script>
</body>
</html>
